<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>PokéRogue – Party Strip</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --good:  #35e878;
      --warn:  #ffd447;
      --bad:   #ff4f5e;
    }

    /* Type colors */
    .tc-normal    { --tc: 168,168,120; }  .tc-fire      { --tc: 240,128,48;  }
    .tc-water     { --tc: 104,144,240; }  .tc-electric  { --tc: 248,208,48;  }
    .tc-grass     { --tc: 120,200,80;  }  .tc-ice       { --tc: 152,216,216; }
    .tc-fighting  { --tc: 192,48,40;   }  .tc-poison    { --tc: 160,64,160;  }
    .tc-ground    { --tc: 224,192,104; }  .tc-flying    { --tc: 168,144,240; }
    .tc-psychic   { --tc: 248,88,136;  }  .tc-bug       { --tc: 168,184,32;  }
    .tc-rock      { --tc: 184,160,56;  }  .tc-ghost     { --tc: 112,88,152;  }
    .tc-dragon    { --tc: 112,56,248;  }  .tc-dark      { --tc: 112,88,72;   }
    .tc-steel     { --tc: 184,184,208; }  .tc-fairy     { --tc: 238,153,172; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent;
      font-family: 'Rajdhani', 'Inter', sans-serif;
      color: #f8fbff;
    }

    /* ── Strip container ────────────────────────── */
    .strip {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: linear-gradient(180deg, rgba(8,10,24,0.82), rgba(4,8,20,0.78));
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.55);
      width: max-content;
    }

    /* ── Individual card ────────────────────────── */
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 108px;
      padding: 8px 6px 10px;
      background: linear-gradient(180deg, rgba(var(--tc,139,92,246),0.18), rgba(var(--tc,139,92,246),0.06));
      border: 1px solid rgba(var(--tc,139,92,246), 0.28);
      border-radius: 12px;
      gap: 4px;
      transition: border-color 0.3s;
      position: relative;
    }

    .card.fainted {
      opacity: 0.42;
      filter: grayscale(0.7);
    }

    /* ── Shiny badge ────────────────────────────── */
    .shiny-badge {
      position: absolute;
      top: 5px;
      right: 5px;
      font-size: 11px;
      line-height: 1;
    }

    /* ── Sprite ─────────────────────────────────── */
    .sprite-wrap {
      width: 72px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sprite {
      max-width: 72px;
      max-height: 60px;
      image-rendering: pixelated;
      object-fit: contain;
    }

    /* ── Name ───────────────────────────────────── */
    .poke-name {
      font-family: 'Inter', sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      letter-spacing: 0.01em;
    }

    .level {
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.06em;
    }

    /* ── Type badges ────────────────────────────── */
    .types {
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .type-badge {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 1px 6px;
      border-radius: 10px;
      background: rgba(var(--tc,139,92,246), 0.28);
      border: 1px solid rgba(var(--tc,139,92,246), 0.5);
      color: #fff;
    }

    /* ── HP bar ─────────────────────────────────── */
    .hp-bar-wrap {
      width: 100%;
      padding: 0 2px;
    }

    .hp-bar-bg {
      width: 100%;
      height: 5px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .hp-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.4s ease, background 0.4s ease;
    }

    .hp-text {
      font-size: 9.5px;
      color: rgba(255,255,255,0.5);
      text-align: center;
      margin-top: 2px;
    }

    /* ── Status dot ─────────────────────────────── */
    .status {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 1px 6px;
      border-radius: 10px;
      background: rgba(255,212,71,0.22);
      border: 1px solid rgba(255,212,71,0.4);
      color: #ffd447;
    }

    /* Empty slot */
    .card.empty {
      opacity: 0.18;
      border-style: dashed;
    }

    .empty-sprite {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
    }

    #loading {
      color: rgba(255,255,255,0.4);
      font-size: 14px;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="strip" id="strip">
    <div id="loading">Waiting for game data…</div>
  </div>

  <script>
    const TYPE_CLASS = {
      NORMAL:'tc-normal', FIRE:'tc-fire', WATER:'tc-water', ELECTRIC:'tc-electric',
      GRASS:'tc-grass', ICE:'tc-ice', FIGHTING:'tc-fighting', POISON:'tc-poison',
      GROUND:'tc-ground', FLYING:'tc-flying', PSYCHIC:'tc-psychic', BUG:'tc-bug',
      ROCK:'tc-rock', GHOST:'tc-ghost', DRAGON:'tc-dragon', DARK:'tc-dark',
      STEEL:'tc-steel', FAIRY:'tc-fairy'
    };

    function typeClass(t) {
      return TYPE_CLASS[(t||'').toUpperCase()] || 'tc-normal';
    }

    function cleanName(name) {
      return String(name || '').toLowerCase()
        .replace(/[^a-z0-9]/g, '')
        .replace(/^(mr|ms|mrs|jr|sr)/, m => m);
    }

    function spriteSrc(name, form) {
      const base = cleanName(name);
      const f = (form || '').toLowerCase().replace(/[^a-z0-9]/g, '');
      if (f) return `https://play.pokemonshowdown.com/sprites/gen5ani/${base}-${f}.gif`;
      return `https://play.pokemonshowdown.com/sprites/gen5ani/${base}.gif`;
    }

    function spriteFallback(img) {
      const name = img.dataset.name;
      const base = cleanName(name);
      const fallbacks = [
        `https://play.pokemonshowdown.com/sprites/gen5/${base}.png`,
        `https://play.pokemonshowdown.com/sprites/gen8/${base}.png`,
      ];
      const idx = Number(img.dataset.fallback || 0);
      if (idx < fallbacks.length) {
        img.dataset.fallback = idx + 1;
        img.src = fallbacks[idx];
      }
    }

    function hpPct(p) {
      const hp = Number(p.hp ?? p.currentHP ?? 0);
      const max = Number(p.maxHp ?? p.maxHP ?? 1);
      return Math.max(0, Math.min(100, (hp / max) * 100));
    }

    function hpColor(pct) {
      if (pct <= 25) return 'var(--bad)';
      if (pct <= 50) return 'var(--warn)';
      return 'var(--good)';
    }

    function variantIcon(variant) {
      if (!variant || variant === 'N/A') return '';
      if (variant === 'Rare') return '✦';      // gold-ish rarity
      if (variant === 'Epic') return '✦✦';
      return '✦';
    }

    function renderCard(p) {
      const pct = hpPct(p);
      const primaryType = (p.types || [])[0] || 'Normal';
      const tc = typeClass(primaryType);
      const isFainted = pct === 0;
      const shinyIcon = p.shiny ? `<div class="shiny-badge" title="Shiny ${p.variant || ''}">✨${variantIcon(p.variant)}</div>` : '';
      const statusHtml = p.status ? `<div class="status">${p.status}</div>` : '';
      const typesHtml = (p.types || []).map(t =>
        `<span class="type-badge ${typeClass(t)}" style="--tc:var(--${typeClass(t).replace('tc-','')},139,92,246)">${t}</span>`
      ).join('');

      return `
        <div class="card ${tc} ${isFainted ? 'fainted' : ''}">
          ${shinyIcon}
          <div class="sprite-wrap">
            <img class="sprite" src="${spriteSrc(p.name, p.form)}"
              data-name="${p.name}" data-fallback="0"
              onerror="spriteFallback(this)" alt="${p.name}">
          </div>
          <div class="poke-name">${p.name || '???'}</div>
          <div class="level">Lv.${p.level ?? '--'}</div>
          <div class="types">${typesHtml}</div>
          ${statusHtml}
          <div class="hp-bar-wrap">
            <div class="hp-bar-bg">
              <div class="hp-bar-fill" style="width:${pct}%; background:${hpColor(pct)};"></div>
            </div>
            <div class="hp-text">${p.hp ?? '--'}/${p.maxHp ?? '--'}</div>
          </div>
        </div>
      `;
    }

    function renderEmpty() {
      return `
        <div class="card empty">
          <div class="sprite-wrap"><div class="empty-sprite"></div></div>
          <div class="poke-name" style="opacity:0.3">Empty</div>
        </div>
      `;
    }

    function render(team) {
      const strip = document.getElementById('strip');
      const slots = [...team];
      while (slots.length < 6) slots.push(null);
      strip.innerHTML = slots.map(p => p ? renderCard(p) : renderEmpty()).join('');
    }

    async function fetchData() {
      try {
        const res = await fetch('/data', { cache: 'no-store' });
        const data = await res.json();
        const team = data.team || [];
        if (team.length) render(team);
      } catch (e) {}
    }

    setInterval(fetchData, 1000);
    fetchData();
  </script>
</body>
</html>
