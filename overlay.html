<!DOCTYPE html>
<html>
<head>
  <title>PokéRogue Stream Layout</title>
  <meta charset="UTF-8" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@500;700;900&display=swap');

    :root {
      --bg1: #150a2b;
      --bg2: #061a32;
      --bg3: #070c14;
      --panel: rgba(12, 18, 30, 0.88);
      --border: rgba(255, 255, 255, 0.22);
      --text: #f8fbff;
      --muted: rgba(248, 251, 255, 0.72);
      --good: #35e878;
      --warn: #ffd447;
      --bad: #ff4f5e;
      --burn: #ff643d;
      --sleep: #9aa8ff;
      --paralyze: #ffd447;
      --freeze: #69d7ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      color: var(--text);
      font-family: 'Rajdhani', 'Inter', Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 16%, rgba(139, 92, 246, 0.5), transparent 30%),
        radial-gradient(circle at 82% 18%, rgba(34, 211, 238, 0.38), transparent 34%),
        radial-gradient(circle at 50% 88%, rgba(255, 68, 126, 0.22), transparent 42%),
        linear-gradient(135deg, var(--bg1), var(--bg2) 48%, var(--bg3));
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at center, black, transparent 82%);
      pointer-events: none;
    }

    .layout {
      position: relative;
      width: 100vw;
      height: 100vh;
      padding: 1.35vh 1.15vw;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(520px, 36.2vw);
      grid-template-rows: minmax(0, 69vh) minmax(0, 28.3vh);
      gap: 1.25vh 1vw;
    }

    .panel {
      background: linear-gradient(180deg, rgba(255,255,255,0.105), rgba(255,255,255,0.045)), var(--panel);
      border: 1px solid var(--border);
      border-radius: 2.1vh;
      box-shadow: 0 1.4vh 3.2vh rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(10px);
      min-height: 0;
      overflow: hidden;
    }

    .game-frame {
      position: relative;
      border-radius: 2.4vh;
      border: 3px solid rgba(255, 255, 255, 0.44);
      background: rgba(0, 0, 0, 0.26);
      box-shadow:
        0 0 0 0.48vw rgba(0,0,0,0.22),
        0 0 2vw rgba(34, 211, 238, 0.26),
        0 0 3vw rgba(139, 92, 246, 0.24);
      overflow: hidden;
    }

    .game-frame::after {
      content: "LANDSCAPE GAME CAPTURE HERE";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.34);
      font-family: 'Inter', sans-serif;
      font-size: clamp(18px, 1.7vw, 34px);
      font-weight: 900;
      letter-spacing: 0.12em;
      text-shadow: 0 2px 12px rgba(0,0,0,0.75);
      pointer-events: none;
    }

    .team-panel {
      grid-row: 1 / 3;
      grid-column: 2 / 3;
      padding: 0.75vh 0.8vw;
      display: flex;
      flex-direction: column;
    }

    .team-list {
      display: grid;
      grid-template-rows: repeat(6, minmax(0, 1fr));
      gap: 0.72vh;
      min-height: 0;
      flex: 1;
    }

    .card {
      position: relative;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(94px, 6.2vw) 1fr;
      gap: 0.65vw;
      padding: 0.55vh 0.72vw;
      border-radius: 1.65vh;
      background:
        linear-gradient(90deg, rgba(var(--type-rgb, 139, 92, 246), 0.32), rgba(255,255,255,0.04)),
        rgba(0, 0, 0, 0.34);
      border: 1px solid rgba(var(--type-rgb, 139, 92, 246), 0.58);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      width: 9vw;
      height: 9vw;
      right: -3.4vw;
      top: -3.4vw;
      border-radius: 50%;
      background: rgba(var(--type-rgb, 139, 92, 246), 0.2);
    }

    .sprite-column {
      position: relative;
      z-index: 2;
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: stretch;
    }

    .sprite-box {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 1.3vh;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      overflow: hidden;
    }

    .sprite {
      max-width: 92%;
      max-height: 92%;
      image-rendering: pixelated;
      filter: drop-shadow(0 5px 7px rgba(0,0,0,0.45));
    }

    .mon-body {
      position: relative;
      z-index: 2;
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr);
      gap: 0.32vh;
    }

    .mon-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.6vw;
      align-items: start;
    }

    .name {
      font-family: 'Inter', sans-serif;
      font-size: clamp(16px, 1.13vw, 22px);
      font-weight: 900;
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .edit-btn {
      cursor: pointer;
      border: 0;
      border-radius: 0.45vh;
      padding: 0.12vh 0.38vw;
      margin-left: 0.3vw;
      font-family: inherit;
      font-size: clamp(9px, 0.55vw, 10px);
      font-weight: 900;
      color: #06111f;
      background: #a5f3fc;
      vertical-align: middle;
    }

    .level {
      font-size: clamp(12px, 0.82vw, 15px);
      color: var(--muted);
      font-weight: 900;
      text-align: right;
      white-space: nowrap;
      line-height: 1.1;
    }

    .info-line {
      display: flex;
      align-items: center;
      gap: 0.45vw;
      min-width: 0;
      font-size: clamp(10px, 0.72vw, 14px);
      color: var(--muted);
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
    }

    .types {
      display: flex;
      align-items: center;
      gap: 0.22vw;
      flex: 0 0 auto;
    }

    .type-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.14vh 0.38vw;
      border-radius: 999px;
      font-size: clamp(9px, 0.58vw, 11px);
      font-weight: 900;
      letter-spacing: .035em;
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,.55);
      background: rgb(var(--badge-rgb, 139, 92, 246));
      border: 1px solid rgba(255,255,255,.3);
    }

    .info-text {
      display: flex;
      gap: 0.55vw;
      min-width: 0;
      overflow: hidden;
    }

    .info-text span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .info-text b { color: white; }

    .hp-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5vw;
      align-items: center;
      margin-top: 0.05vh;
    }

    .hpbar {
      position: relative;
      height: clamp(9px, 1vh, 13px);
      background: rgba(0,0,0,0.45);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .hpfill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: var(--good);
      transition: width .45s ease, background-color .25s ease;
      box-shadow: 0 0 10px currentColor;
    }

    .hptext {
      font-size: clamp(12px, 0.82vw, 15px);
      font-weight: 900;
      min-width: 4.8vw;
      text-align: right;
      white-space: nowrap;
    }

    .moves {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(2, minmax(25px, 1fr));
      gap: 0.42vh 0.42vw;
      min-height: 0;
      align-content: stretch;
    }

    .move {
      display: flex;
      align-items: center;
      gap: 0.28vw;
      min-height: 25px;
      padding: 0.28vh 0.44vw;
      border-radius: 0.75vh;
      background: rgba(var(--move-rgb, 255,255,255), 0.24);
      border: 1px solid rgba(var(--move-rgb, 255,255,255), 0.62);
      font-size: clamp(12px, 0.86vw, 16px);
      overflow: hidden;
      cursor: pointer;
      line-height: 1;
    }

    .move .move-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      font-weight: 900;
      text-shadow: 0 1px 2px rgba(0,0,0,.45);
    }

    .move.add-move {
      color: #a5f3fc;
      border-style: dashed;
      justify-content: center;
      font-weight: 900;
      background: rgba(0,0,0,0.25);
    }

    .status {
      display: inline-block;
      padding: 0.1vh 0.38vw;
      border-radius: 999px;
      font-size: clamp(9px, 0.55vw, 10px);
      font-weight: 900;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.22);
    }

    .bottom-panel {
      grid-column: 1 / 2;
      display: grid;
      grid-template-columns: 1fr 1.15fr 0.85fr;
      gap: 1.05vw;
      padding: 1.05vh 0.9vw;
      min-height: 0;
    }

    .run-card, .blank-card {
      min-height: 0;
      border-radius: 1.65vh;
      background: rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.13);
      overflow: hidden;
    }

    .run-card { padding: 0.85vh 0.85vw; }

    .boss-title {
      font-family: 'Inter', sans-serif;
      font-size: clamp(16px, 1.1vw, 22px);
      font-weight: 900;
      margin: 0 0 0.35vh;
      text-align: center;
    }

    .next-boss {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 51%;
      border-radius: 1.2vh;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      margin-bottom: 0.6vh;
    }

    .boss-wave {
      font-family: 'Inter', sans-serif;
      font-size: clamp(42px, 4vw, 76px);
      font-weight: 950;
      line-height: 0.9;
      background: linear-gradient(90deg, #fff, #a5f3fc, #c4b5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .boss-type {
      margin-top: 0.25vh;
      font-size: clamp(17px, 1.25vw, 24px);
      font-weight: 900;
    }

    .boss-countdown {
      color: var(--muted);
      font-size: clamp(13px, 0.95vw, 18px);
      font-weight: 800;
    }

    .wave-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.42vh 0.42vw;
      height: calc(49% - 0.95vh);
    }

    .wave-chip {
      padding: 0.5vh 0.42vw;
      border-radius: 1vh;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      font-size: clamp(11px, 0.78vw, 15px);
      line-height: 1.05;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .wave-chip.soon {
      background: rgba(255, 212, 71, 0.18);
      border-color: rgba(255, 212, 71, 0.55);
      color: #fff2a7;
    }

    .wave-chip.now {
      background: rgba(255, 79, 94, 0.2);
      border-color: rgba(255, 79, 94, 0.65);
      color: #ffd0d5;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.58);
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .modal {
      width: min(760px, 92vw);
      max-height: 86vh;
      overflow: auto;
      padding: 18px;
      border-radius: 24px;
      background: rgba(11, 16, 27, 0.98);
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 20px 70px rgba(0,0,0,.6);
    }

    .modal h2 { margin: 0 0 12px; font-family: 'Inter', sans-serif; }
    .modal label { display:block; margin-top: 10px; color: var(--muted); font-size: 13px; font-weight: 900; text-transform: uppercase; }
    .modal input, .modal select {
      width: 100%;
      margin-top: 4px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.08);
      color: white;
      font: inherit;
      font-size: 16px;
    }
    .modal option { color: black; }
    .modal-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-actions { display:flex; justify-content:flex-end; gap: 8px; margin-top: 16px; }
    .modal button {
      border:0;
      padding: 9px 14px;
      border-radius: 12px;
      font: inherit;
      font-weight: 900;
      cursor:pointer;
    }
    .save { background: #35e878; color:#04100a; }
    .cancel { background: rgba(255,255,255,.14); color:white; }
  </style>
</head>
<body>
  <main class="layout">
    <div class="game-frame"></div>

    <section class="team-panel panel">
      <div id="team" class="team-list">Loading team...</div>
    </section>

    <section class="bottom-panel panel">
      <div class="run-card">
        <div class="boss-title">Boss Battles</div>
        <div id="nextBoss" class="next-boss"></div>
        <div class="wave-list" id="waveList"></div>
      </div>

      <div class="blank-card"></div>
      <div class="blank-card"></div>
    </section>
  </main>

  <div class="modal-backdrop" id="editorBackdrop">
    <div class="modal">
      <h2 id="editorTitle">Edit Pokémon Info</h2>
      <div class="modal-grid">
        <div>
          <label>Nickname</label>
          <input id="editNickname" placeholder="Optional nickname">
        </div>
        <div>
          <label>Nature</label>
          <select id="editNature"></select>
        </div>
        <div>
          <label>Ability</label>
          <input id="editAbility" list="abilityList" placeholder="Type ability manually">
        </div>
        <div>
          <label>Passive</label>
          <input id="editPassive" list="abilityList" placeholder="Type passive manually">
        </div>
      </div>
      <label>Moves</label>
      <div class="modal-grid" id="moveEditors"></div>
      <datalist id="abilityList"></datalist>
      <datalist id="moveList"></datalist>
      <div class="modal-actions">
        <button class="cancel" onclick="closeEditor()">Cancel</button>
        <button class="save" onclick="saveEditor()">Save</button>
      </div>
    </div>
  </div>

<script>
  const TYPE_COLORS = {
    NORMAL: '168,168,120', FIRE: '240,128,48', WATER: '104,144,240', ELECTRIC: '248,208,48', GRASS: '120,200,80', ICE: '152,216,216',
    FIGHTING: '192,48,40', POISON: '160,64,160', GROUND: '224,192,104', FLYING: '168,144,240', PSYCHIC: '248,88,136', BUG: '168,184,32',
    ROCK: '184,160,56', GHOST: '112,88,152', DRAGON: '112,56,248', DARK: '112,88,72', STEEL: '184,184,208', FAIRY: '238,153,172'
  };

  const STATUS_COLORS = {
    BRN: 'var(--burn)', BURN: 'var(--burn)', PSN: 'var(--poison)', TOX: 'var(--poison)', PAR: 'var(--paralyze)', SLP: 'var(--sleep)', FRZ: 'var(--freeze)', FNT: 'var(--bad)'
  };

  const NATURES = ['Hardy','Lonely','Brave','Adamant','Naughty','Bold','Docile','Relaxed','Impish','Lax','Timid','Hasty','Serious','Jolly','Naive','Modest','Mild','Quiet','Bashful','Rash','Calm','Gentle','Sassy','Careful','Quirky'];
  const FALLBACK_ABILITIES = ['Adaptability','Aerilate','Analytic','Anger Point','Beast Boost','Chlorophyll','Clear Body','Contrary','Defiant','Drizzle','Drought','Electric Surge','Flash Fire','Huge Power','Hustle','Ice Scales','Intimidate','Levitate','Magic Guard','Misty Surge','Moxie','No Guard','Pixilate','Poison Heal','Prankster','Pressure','Protean','Psychic Surge','Regenerator','Sand Stream','Sheer Force','Simple','Snow Warning','Speed Boost','Swift Swim','Technician','Tough Claws','Unaware','Volt Absorb','Water Absorb'];

  const FALLBACK_MOVES = [
    ['Protect','NORMAL'],['Fake Out','NORMAL'],['Extreme Speed','NORMAL'],['Hyper Voice','NORMAL'],['Swords Dance','NORMAL'],['Nasty Plot','DARK'],['Calm Mind','PSYCHIC'],['Recover','NORMAL'],['Substitute','NORMAL'],
    ['Flamethrower','FIRE'],['Fire Blast','FIRE'],['Flare Blitz','FIRE'],['Heat Wave','FIRE'],['Bitter Blade','FIRE'],
    ['Surf','WATER'],['Hydro Pump','WATER'],['Waterfall','WATER'],['Aqua Jet','WATER'],['Water Spout','WATER'],['Splishy Splash','WATER'],
    ['Thunderbolt','ELECTRIC'],['Thunder','ELECTRIC'],['Discharge','ELECTRIC'],['Volt Switch','ELECTRIC'],['Thunder Wave','ELECTRIC'],
    ['Giga Drain','GRASS'],['Energy Ball','GRASS'],['Leaf Blade','GRASS'],['Spore','GRASS'],['Tailwind','FLYING'],['Hurricane','FLYING'],['Air Slash','FLYING'],
    ['Ice Beam','ICE'],['Blizzard','ICE'],['Icy Wind','ICE'],['Triple Axel','ICE'],
    ['Close Combat','FIGHTING'],['Drain Punch','FIGHTING'],['Aura Sphere','FIGHTING'],['Body Press','FIGHTING'],
    ['Sludge Bomb','POISON'],['Sludge Wave','POISON'],['Gunk Shot','POISON'],['Toxic','POISON'],
    ['Earthquake','GROUND'],['Earth Power','GROUND'],['High Horsepower','GROUND'],['Scorching Sands','GROUND'],
    ['Psychic','PSYCHIC'],['Psyshock','PSYCHIC'],['Expanding Force','PSYCHIC'],['Stored Power','PSYCHIC'],
    ['X-Scissor','BUG'],['Bug Buzz','BUG'],['U-turn','BUG'],
    ['Rock Slide','ROCK'],['Stone Edge','ROCK'],['Power Gem','ROCK'],
    ['Shadow Ball','GHOST'],['Shadow Sneak','GHOST'],['Last Respects','GHOST'],['Spirit Shackle','GHOST'],
    ['Dragon Claw','DRAGON'],['Dragon Pulse','DRAGON'],['Draco Meteor','DRAGON'],['Outrage','DRAGON'],
    ['Dark Pulse','DARK'],['Knock Off','DARK'],['Crunch','DARK'],['Parting Shot','DARK'],
    ['Flash Cannon','STEEL'],['Iron Head','STEEL'],['Tachyon Cutter','STEEL'],['Behemoth Blade','STEEL'],
    ['Moonblast','FAIRY'],['Dazzling Gleam','FAIRY'],['Play Rough','FAIRY']
  ];

  const BOSS_WAVES = [
    { wave: 8, type: 'Rival' }, { wave: 25, type: 'Rival' }, { wave: 35, type: 'Evil Team' }, { wave: 55, type: 'Rival' },
    { wave: 62, type: 'Evil Team' }, { wave: 64, type: 'Evil Team' }, { wave: 66, type: 'Evil Team' }, { wave: 95, type: 'Rival' },
    { wave: 112, type: 'Evil Team' }, { wave: 114, type: 'Evil Team' }, { wave: 115, type: 'Evil Team Leader' },
    { wave: 145, type: 'Rival' }, { wave: 164, type: 'Evil Team' }, { wave: 165, type: 'Evil Team Leader' },
    { wave: 195, type: 'Rival' }, { wave: 200, type: 'Final Boss' }
  ];

  let currentEditKey = null;
  let currentTeamCache = [];
  let allMovesByName = new Map(FALLBACK_MOVES.map(([name, type]) => [name.toLowerCase(), { name, type }]));

  function storageKey(mon) { return `pokerogue-overlay-custom:${mon.name || 'unknown'}:${mon.form || ''}`; }
  function loadCustom(mon) { try { return JSON.parse(localStorage.getItem(storageKey(mon))) || {}; } catch { return {}; } }
  function saveCustom(mon, data) { localStorage.setItem(storageKey(mon), JSON.stringify(data)); }
  function slug(name) { return String(name || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
  function normalizeForm(form) {
    const f = String(form || '').toLowerCase().trim();
    if (!f) return '';
    if (f === 'mega') return 'mega';
    if (f === 'mega-x' || f === 'megax' || f === 'mega x') return 'megax';
    if (f === 'mega-y' || f === 'megay' || f === 'mega y') return 'megay';
    if (f === 'gmax' || f === 'gigantamax') return 'gmax';
    return slug(f);
  }

  function cleanPokemonName(name) {
    let n = String(name || '').trim();
    if (n.toLowerCase().endsWith('-mega')) n = n.slice(0, -5);
    return n.split(' ').filter(Boolean).join(' ');
  }

  function baseNameForSprite(name) {
    let n = cleanPokemonName(name);
    if (n.toLowerCase().startsWith('mega ')) n = n.slice(5);
    return n.trim();
  }

  function formFromName(name, explicitForm) {
    const n = String(name || '').toLowerCase();
    const f = normalizeForm(explicitForm);
    if (f) return f;
    if (n.startsWith('mega ') || n.endsWith('-mega')) return 'mega';
    if (n.endsWith('-mega-x') || n.includes('mega x')) return 'megax';
    if (n.endsWith('-mega-y') || n.includes('mega y')) return 'megay';
    if (n.endsWith('-gmax') || n.includes('gigantamax')) return 'gmax';
    return '';
  }

  function primaryFusionName(name) {
    let n = cleanPokemonName(name);
    n = n.replace(' fused with ', '/').replace(' + ', '/').replace(' x ', '/');
    return n.split('/')[0].trim();
  }

  function isFusionName(name) {
    const n = String(name || '').toLowerCase();
    return n.includes('/') || n.includes(' fused with ') || n.includes(' + ') || n.includes(' x ');
  }

  function dnaFallbackSvg() {
    return '/dna-splicer.png';
  }

  function spriteCandidates(name, form) {
    const fusion = isFusionName(name);
    const primary = primaryFusionName(name);
    const baseName = fusion ? primary : baseNameForSprite(name);
    const base = slug(baseName || name);
    const f = fusion ? '' : formFromName(name, form);
    const candidates = [];

    if (f === 'gmax') {
      candidates.push('https://play.pokemonshowdown.com/sprites/gen5ani-gmax/' + base + '-gmax.gif');
      candidates.push('https://play.pokemonshowdown.com/sprites/gen5-gmax/' + base + '-gmax.png');
      candidates.push('https://play.pokemonshowdown.com/sprites/gen8-gmax/' + base + '-gmax.png');
    } else if (f) {
      candidates.push('https://play.pokemonshowdown.com/sprites/gen5/' + base + '-' + f + '.png');
      candidates.push('https://play.pokemonshowdown.com/sprites/gen5ani/' + base + '-' + f + '.gif');
      candidates.push('https://play.pokemonshowdown.com/sprites/gen8/' + base + '-' + f + '.png');
    }

    candidates.push('https://play.pokemonshowdown.com/sprites/gen5/' + base + '.png');
    candidates.push('https://play.pokemonshowdown.com/sprites/gen5ani/' + base + '.gif');
    candidates.push('https://play.pokemonshowdown.com/sprites/gen8/' + base + '.png');
    candidates.push(dnaFallbackSvg());
    return candidates;
  }

  function spriteKey(name, form) {
    return cleanPokemonName(name) + '|' + normalizeForm(form);
  }

  const resolvedSprites = {};

  function sprite(name, form) {
    const key = spriteKey(name, form);
    return resolvedSprites[key] || spriteCandidates(name, form)[0];
  }

  function markSpriteLoaded(img) {
    const key = img.dataset.spriteKey;
    if (!key || !img.src) return;
    resolvedSprites[key] = img.src;
  }

  function nextSpriteFallback(img) {
    const list = JSON.parse(img.dataset.spriteList || '[]');
    const nextIndex = Number(img.dataset.spriteIndex || 0) + 1;
    if (nextIndex >= list.length) return;
    img.dataset.spriteIndex = String(nextIndex);
    img.src = list[nextIndex];
  }
  function typeRgb(type) { return TYPE_COLORS[String(type || '').toUpperCase()] || '139,92,246'; }

  function hpPercent(p) {
    const hp = Number(p.hp ?? p.currentHP ?? 0);
    const max = Number(p.maxHp ?? p.maxHP ?? 1);
    return Math.max(0, Math.min(100, (hp / max) * 100));
  }

  function hpColor(percent) {
    if (percent <= 25) return 'var(--bad)';
    if (percent <= 50) return 'var(--warn)';
    return 'var(--good)';
  }

  function renderType(type) { return `<span class="type-badge" style="--badge-rgb:${typeRgb(type)}">${type}</span>`; }

  function renderStatus(status) {
    if (!status) return '';
    const color = STATUS_COLORS[String(status).toUpperCase()] || 'rgba(255,255,255,0.25)';
    return `<span class="status" style="background:${color}; color:#101010;">${status}</span>`;
  }

  function renderMove(move, monIndex) {
    if (!move) return `<div class="move add-move" onclick="openEditor(${monIndex})">+ Add Move</div>`;
    const name = typeof move === 'string' ? move : move.name;
    const type = typeof move === 'object' ? move.type : '';
    return `
      <div class="move" style="--move-rgb:${typeRgb(type)}" onclick="openEditor(${monIndex})" title="Click to edit moves">
        ${type ? renderType(type) : ''}
        <span class="move-name">${name || 'Unknown'}</span>
      </div>
    `;
  }

  function applyCustom(p) {
    const custom = loadCustom(p);
    return {
      ...p,
      nickname: p.nickname || custom.nickname || '',
      ability: p.ability || custom.ability || '',
      passive: p.passive || custom.passive || '',
      nature: p.nature || custom.nature || '',
      moves: (p.moves && p.moves.length ? p.moves : custom.moves) || []
    };
  }

  function renderPokemon(raw, index) {
    const p = applyCustom(raw);
    const primaryType = (p.types || [])[0] || 'PSYCHIC';
    const percent = hpPercent(p);
    const hp = p.hp ?? p.currentHP ?? '--';
    const maxHp = p.maxHp ?? p.maxHP ?? '--';
    const rawName = p.name || `Pokemon ${index + 1}`;
    const realName = cleanPokemonName(rawName);
    const displayName = p.nickname ? `${p.nickname} (${realName})` : realName;
    const moves = [...(p.moves || [])];
    while (moves.length < 4) moves.push(null);

    return `
      <div class="card" style="--type-rgb:${typeRgb(primaryType)}">
        <div class="sprite-column">
          <div class="sprite-box">
            <img class="sprite" src="${sprite(realName, p.form)}" data-sprite-key="${spriteKey(realName, p.form)}" data-sprite-index="0" data-sprite-list='${JSON.stringify(spriteCandidates(realName, p.form))}' onload="markSpriteLoaded(this)" onerror="nextSpriteFallback(this)">
          </div>
        </div>
        <div class="mon-body">
          <div class="mon-top">
            <div class="name">${displayName}${p.form ? `-${p.form}` : ''} <button class="edit-btn" onclick="openEditor(${index})">EDIT</button></div>
            <div class="level">Lv. ${p.level ?? '--'}<br>Tera: ${p.teraType || '--'} ${renderStatus(p.status || '')}</div>
          </div>

          <div class="info-line">
            <div class="types">${(p.types || []).map(renderType).join('')}</div>
            <div class="info-text">
              <span><b>Ability:</b> ${p.ability || 'Click edit'}</span>
              <span><b>Passive:</b> ${p.passive || 'Click edit'}</span>
              <span><b>Nature:</b> ${p.nature || 'Click edit'}</span>
            </div>
          </div>

          <div class="hp-row">
            <div class="hpbar"><div class="hpfill" style="width:${percent}%; background:${hpColor(percent)};"></div></div>
            <div class="hptext">${hp}/${maxHp}</div>
          </div>

          <div class="moves">${moves.slice(0,4).map(m => renderMove(m, index)).join('')}</div>
        </div>
      </div>
    `;
  }

  function getUpcomingBosses(currentWave) {
    const wave = Number(currentWave) || 0;
    return BOSS_WAVES.filter(x => x.wave >= wave).slice(0, 4).map(x => ({ ...x, distance: x.wave - wave }));
  }

  function renderBossPanel(wave) {
    const upcoming = getUpcomingBosses(wave);
    const next = upcoming[0];
    if (!next) {
      document.getElementById('nextBoss').innerHTML = `<div class="boss-wave">--</div><div class="boss-type">Run Complete</div><div class="boss-countdown">No more bosses</div>`;
      document.getElementById('waveList').innerHTML = '';
      return;
    }

    const countdown = next.distance === 0 ? 'NOW' : `${next.distance} wave${next.distance === 1 ? '' : 's'} away`;
    document.getElementById('nextBoss').innerHTML = `
      <div class="boss-wave">${next.wave}</div>
      <div class="boss-type">${next.type}</div>
      <div class="boss-countdown">${countdown}</div>
    `;

    document.getElementById('waveList').innerHTML = upcoming.slice(1, 4).map(x => {
      const cls = x.distance === 0 ? 'now' : x.distance <= 5 ? 'soon' : '';
      const dist = x.distance === 0 ? 'NOW' : `in ${x.distance}`;
      return `<div class="wave-chip ${cls}"><b>${x.wave}</b><br>${x.type}<br><small>${dist}</small></div>`;
    }).join('');
  }

  async function fetchData() {
    try {
      const res = await fetch('/data', { cache: 'no-store' });
      const data = await res.json();
      const team = data.team || [];
      currentTeamCache = team;
      renderBossPanel(data.wave);
      document.getElementById('team').innerHTML = team.length ? team.map(renderPokemon).join('') : 'Waiting for team data...';
    } catch (err) {
      document.getElementById('team').textContent = 'Overlay connection error.';
    }
  }

  function setupEditorLists() {
    document.getElementById('abilityList').innerHTML = FALLBACK_ABILITIES.map(a => `<option value="${a}"></option>`).join('');
    document.getElementById('moveList').innerHTML = FALLBACK_MOVES.map(([name]) => `<option value="${name}"></option>`).join('');
    const natureSelect = document.getElementById('editNature');
    natureSelect.innerHTML = '<option value="">Unknown</option>' + NATURES.map(n => `<option value="${n}">${n}</option>`).join('');
  }

  function formatApiName(name) {
    return String(name).split('-').map(x => x[0].toUpperCase() + x.slice(1)).join(' ');
  }

  async function loadMoveDatabase() {
    try {
      const res = await fetch('https://pokeapi.co/api/v2/move?limit=2000');
      const list = await res.json();
      const apiMoves = list.results.map(m => [formatApiName(m.name), '']);
      apiMoves.forEach(([name, type]) => allMovesByName.set(name.toLowerCase(), { name, type }));
      document.getElementById('moveList').innerHTML = [...FALLBACK_MOVES, ...apiMoves].map(([name]) => `<option value="${name}"></option>`).join('');
    } catch {}
  }

  async function loadAbilityDatabase() {
    try {
      const res = await fetch('https://pokeapi.co/api/v2/ability?limit=1000');
      const list = await res.json();
      const apiAbilities = list.results.map(a => formatApiName(a.name));
      const combined = [...new Set([...FALLBACK_ABILITIES, ...apiAbilities])].sort();
      document.getElementById('abilityList').innerHTML = combined.map(a => `<option value="${a}"></option>`).join('');
    } catch {}
  }

  function openEditor(index) {
    const raw = currentTeamCache[index];
    if (!raw) return;
    currentEditKey = index;
    const p = applyCustom(raw);
    document.getElementById('editorTitle').textContent = `Edit ${p.name}`;
    document.getElementById('editNickname').value = p.nickname || '';
    document.getElementById('editAbility').value = p.ability || '';
    document.getElementById('editPassive').value = p.passive || '';
    document.getElementById('editNature').value = p.nature || '';

    const moves = [...(p.moves || [])];
    while (moves.length < 4) moves.push({ name: '', type: '' });
    document.getElementById('moveEditors').innerHTML = moves.slice(0,4).map((m, i) => `
      <div>
        <label>Move ${i + 1} Name</label>
        <input id="moveName${i}" list="moveList" value="${typeof m === 'string' ? m : (m.name || '')}" placeholder="Search or type custom move">
      </div>
      <div>
        <label>Move ${i + 1} Type</label>
        <select id="moveType${i}">
          <option value="">Unknown</option>
          ${Object.keys(TYPE_COLORS).map(t => `<option value="${t}" ${((typeof m === 'object' ? m.type : '') === t) ? 'selected' : ''}>${t}</option>`).join('')}
        </select>
      </div>
    `).join('');

    document.getElementById('editorBackdrop').style.display = 'flex';
  }

  function closeEditor() {
    document.getElementById('editorBackdrop').style.display = 'none';
    currentEditKey = null;
  }

  function saveEditor() {
    const raw = currentTeamCache[currentEditKey];
    if (!raw) return;
    const moves = [];
    for (let i = 0; i < 4; i++) {
      const name = document.getElementById(`moveName${i}`).value.trim();
      const selectedType = document.getElementById(`moveType${i}`).value.trim();
      const known = allMovesByName.get(name.toLowerCase());
      const type = selectedType || known?.type || '';
      if (name) moves.push({ name, type });
    }
    saveCustom(raw, {
      nickname: document.getElementById('editNickname').value.trim(),
      ability: document.getElementById('editAbility').value.trim(),
      passive: document.getElementById('editPassive').value.trim(),
      nature: document.getElementById('editNature').value.trim(),
      moves
    });
    closeEditor();
    fetchData();
  }

async function loadMovesFromFile() {
  try {
    const res = await fetch('/moves.txt', { cache: 'no-store' });
    const text = await res.text();

    text.split(/\r?\n/).forEach(line => {
      line = line.trim();
      if (!line) return;

      const match = line.match(/^(.+?)\s+(BUG|DARK|DRAGON|ELECTRIC|FAIRY|FIGHTING|FIRE|FLYING|GHOST|GRASS|GROUND|ICE|NORMAL|POISON|PSYCHIC|ROCK|STEEL|WATER)$/i);
      if (!match) return;

      const name = match[1].trim();
      const type = match[2].trim().toUpperCase();

      allMovesByName.set(name.toLowerCase(), { name, type });
    });

    document.getElementById('moveList').innerHTML =
      Array.from(allMovesByName.values())
        .sort((a, b) => a.name.localeCompare(b.name))
        .map(m => `<option value="${m.name}"></option>`)
        .join('');

    console.log('Moves loaded from moves.txt');
  } catch (err) {
    console.error('Failed to load moves.txt', err);
  }
}

 setupEditorLists();

(async function startOverlay() {
  await loadMovesFromFile();
  await loadAbilityDatabase();

  setInterval(fetchData, 1000);
  fetchData();
})();
</script>
</body>
</html>
